name: Validate issue 342 reproduction

on:
  pull_request:
    branches: [devel]
    paths: [src/tpstate.ml, .github/workflows/validate-issue-342.yml]

permissions:
  contents: read

jobs:
  reproduce:
    name: ${{ matrix.label }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: baseline-devel, ref: devel}
          - {label: fixed-branch, ref: "${{ github.event.pull_request.head.sha }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ matrix.ref }}"}
      - name: Fetch Elkhound
        run: |
          mkdir -p bin validation/results
          curl -fL --retry 5 https://github.com/The-Mod-Elephant/elkhound/releases/download/1.0.3/lin-elkhound -o bin/elkhound
          chmod +x bin/elkhound
      - uses: ocaml/setup-ocaml@v3.5.1
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options,ocaml-option-default-unsafe-string
      - name: Build WeiDU
        id: build
        run: |
          set -o pipefail
          export PATH="$PATH:$PWD/bin"
          mkdir -p obj/x86_LINUX obj/.depend validation/results
          eval "$(opam env)"
          make 2>&1 | tee validation/results/build.log
          ./weidu.asm.exe --version | tee validation/results/version.txt
          echo status=0 >> "$GITHUB_OUTPUT"
      - name: Download fixture
        run: |
          mkdir -p validation/game validation/results
          curl -fL --retry 5 https://github.com/user-attachments/files/26055748/testmods.zip -o validation/testmods.zip
          unzip -l validation/testmods.zip | tee validation/results/archive-list.txt
          unzip -q validation/testmods.zip -d validation/game
          find validation/game -type f -printf '%P\n' | sort | tee validation/results/extracted-files.txt
          find validation/game -type f -iname '*.tp2' -print -exec sh -c 'for f do echo "===== $f ====="; cat "$f"; done' sh {} + | tee validation/results/tp2-sources.txt
      - name: Run reproduction
        id: reproduce
        shell: bash
        run: |
          set -xuo pipefail
          root="$PWD"; game="$PWD/validation/game"; results="$PWD/validation/results"
          cp "$root/weidu.asm.exe" "$game/weidu"; chmod +x "$game/weidu"
          find_tp2() { find "$game" -type f -iname "*mod$1*.tp2" | head -n1; }
          mod1="$(find_tp2 1)"; mod2="$(find_tp2 2)"; mod3="$(find_tp2 3)"
          printf 'MOD1=%s\nMOD2=%s\nMOD3=%s\n' "$mod1" "$mod2" "$mod3" | tee "$results/resolved-mods.txt"
          run_weidu() {
            local label="$1" tp2="$2"
            echo "===== $label =====" | tee -a "$results/run.log"
            (cd "$game" && ./weidu --noautoupdate --no-exit-pause --nogame --force-install 0 "${tp2#$game/}") 2>&1 | tee -a "$results/run.log"
            local s=${PIPESTATUS[0]}; echo "STATUS[$label]=$s" | tee -a "$results/run.log"; return "$s"
          }
          status=0
          run_weidu install-mod1 "$mod1" || status=1
          run_weidu install-mod2 "$mod2" || status=1
          run_weidu install-mod3 "$mod3" || status=1
          run_weidu reinstall-mod1 "$mod1" || status=1
          find "$game" -type f \( -iname '*.debug' -o -iname 'weidu.log' \) -print -exec sh -c 'for f do echo "===== $f ====="; cat "$f"; done' sh {} + | tee "$results/debug-logs.txt"
          grep -Ein 'leaked variable|local_var|re-install|temporarily|error|fail' "$results/run.log" "$results/debug-logs.txt" | tee "$results/highlights.txt" || true
          echo command_status=$status >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue-342-${{ matrix.label }}
          path: validation
          if-no-files-found: error
