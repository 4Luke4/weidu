name: disposable-control-flow

on:
  push:
    branches:
      - copilot/add-break-goto-statements-support
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Fetch Elkhound
        run: |
          mkdir -p bin
          curl -fL \
            https://github.com/The-Mod-Elephant/elkhound/releases/download/1.0.3/lin-elkhound \
            -o bin/elkhound
          chmod +x bin/elkhound
          ./bin/elkhound

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3.5.1
        with:
          ocaml-compiler: 4.08.1+default-unsafe-string

      - name: Build and test control flow
        run: |
          export PATH="$PATH:$PWD/bin"
          mkdir -p obj/x86_LINUX obj/.depend
          opam switch
          eval "$(opam env)"
          make
          ./test/control-flow/run-tests.sh "$PWD/weidu.asm.exe"
