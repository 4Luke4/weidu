name: discussion-363-ci

on:
  push:
    branches:
      - agent/fix-linux-remote-builds
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux-release-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout the code
        uses: actions/checkout@main

      - name: Fetch elkhound
        run: |
          mkdir -p bin
          curl -Lv https://github.com/The-Mod-Elephant/elkhound/releases/download/1.0.3/lin-elkhound -o bin/elkhound
          chmod +x bin/elkhound
          ./bin/elkhound

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3.5.1
        with:
          ocaml-compiler: ocaml-variants.4.08.1+default-unsafe-string
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git
            archive: git+https://github.com/ocaml/opam-repository-archive.git

      - name: Build Linux release archive
        run: |
          export PATH="$PATH:$PWD/bin"
          mkdir -p obj/x86_LINUX
          mkdir -p obj/.depend
          opam switch
          eval "$(opam env)"
          ocamlopt -version
          make
          make linux_zip
          test -n "$(find . -maxdepth 1 -type f -name 'WeiDU-Linux-*.zip' -print -quit)"

      - name: Upload Linux release archive
        uses: actions/upload-artifact@v6
        with:
          name: discussion-363-linux
          path: WeiDU-Linux-*.zip
          if-no-files-found: error
