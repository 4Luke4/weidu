name: Disposable issue 364 validation

on:
  push:
    branches:
      - ci/issue-364-add-kit-filler-row
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply proposed patch
        run: git apply --check .ci/issue-364.patch && git apply .ci/issue-364.patch

      - name: Check patch formatting
        run: git diff --check

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake flex bison opam

      - name: Create unsafe-string OCaml switch
        run: |
          opam init --bare --disable-sandboxing --yes
          opam switch create weidu ocaml-variants.4.14.2+options ocaml-option-default-unsafe-string --yes

      - name: Build Elkhound
        run: |
          git clone --depth 1 https://github.com/WeiDUorg/elkhound.git "$RUNNER_TEMP/elkhound"
          cmake -S "$RUNNER_TEMP/elkhound/src" -B "$RUNNER_TEMP/elkhound/build" \
            -DCMAKE_BUILD_TYPE=Release -DEXTRAS=OFF -DOCAML=OFF
          cmake --build "$RUNNER_TEMP/elkhound/build" --parallel 2
          echo "$RUNNER_TEMP/elkhound/build" >> "$GITHUB_PATH"

      - name: Build WeiDU
        run: opam exec -- make -j2 weidu

      - name: Verify filler-row replacement semantics
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("src/tpaction.ml").read_text(encoding="utf-8")
          action = source[source.index("let kitlist_action"):source.index("let when_exists")]
          assert "TP_PatchStringTextually" in action
          assert "filler_pattern" in action
          assert "number + 3" not in action
          assert "TP_Patch2DA" not in action

          def replace_filler(table: str, replacement: str) -> str:
              filler = next(
                  line for line in re.split(r"[\r\n]+", table)
                  if re.match(r"^[0-9]+[ \t]+\*[ \t]+\*", line)
              )
              return re.sub(rf"^{re.escape(filler)}$", replacement, table, flags=re.MULTILINE)

          classic = """2DA V1.0
          *
                ROWNAME LOWER MIXED HELP ABILITIES PROFICIENCY UNUSABLE CLASS
          31    BARBARIAN 45855 45859 45869 CLABFI05 51 0x40000000 2
          32    * * * * * * * *
          33    * * * * * * * *
          """
          classic_row = "32  A7_TESTKIT 74439 74440 74441 CLABTEST 53 0x00004000 2"
          classic_result = replace_filler(classic, classic_row)
          classic_tokens = next(line.split() for line in classic_result.splitlines() if "A7_TESTKIT" in line)
          assert classic_tokens == classic_row.split()
          assert len(classic_tokens) == 9
          assert classic_result.count("A7_TESTKIT") == 1

          ee = """2DA V1.0
          *
                ROWNAME LOWER MIXED HELP ABILITIES PROFICIENCY UNUSABLE CLASS KITIDS
          31    BARBARIAN 45855 45859 45869 CLABFI05 51 0x40000000 2 BARBARIAN
          32    * * * * * * * * *
          33    * * * * * * * * *
          """
          ee_row = "32  A7_TESTKIT 74439 74440 74441 CLABTEST 53 0x00004000 2 A7_TESTKIT"
          ee_result = replace_filler(ee, ee_row)
          ee_tokens = next(line.split() for line in ee_result.splitlines() if "A7_TESTKIT" in line)
          assert ee_tokens == ee_row.split()
          assert len(ee_tokens) == 10
          assert ee_tokens[-1] == "A7_TESTKIT"
          assert ee_result.count("A7_TESTKIT") == 2
          assert "32    * * * * * * * * *" not in ee_result
          PY

      - name: Publish clean final branch
        env:
          FINAL_BRANCH: fix/issue-364-add-kit-filler-row
        run: |
          cp .ci/issue-364.patch "$RUNNER_TEMP/issue-364.patch"
          git checkout -B "$FINAL_BRANCH" origin/devel
          git apply --check "$RUNNER_TEMP/issue-364.patch"
          git apply "$RUNNER_TEMP/issue-364.patch"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tpaction.ml doc/base.tex
          git commit -m "Fix ADD_KIT filler-row replacement" \
            -m "CI-Validation: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push --force origin "$FINAL_BRANCH"
